<svg xmlns="http://www.w3.org/2000/svg" width="90" height="90" viewBox="0 0 90 90">
  <defs>
    <linearGradient id="goldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C59B27" stop-opacity="0.65"/>
      <stop offset="35%" stop-color="#E5C158" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#D4AF37" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#A67C1E" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="goldShimmer" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E5C158" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#D4AF37" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#C59B27" stop-opacity="0.07"/>
    </linearGradient>
  </defs>

  <!-- Central & Corner Stepped Diamond Lattice -->
  <path d="M0 45 L45 0 L90 45 L45 90 Z" fill="url(#goldShimmer)" stroke="url(#goldStroke)" stroke-width="1.2"/>
  <path d="M0 45 L45 0 L90 45 L45 90 Z" fill="none" stroke="url(#goldStroke)" stroke-width="0.6" stroke-dasharray="2,2"/>
  
  <path d="M0 0 L45 45 L0 90 Z" fill="none" stroke="url(#goldStroke)" stroke-width="0.8"/>
  <path d="M90 0 L45 45 L90 90 Z" fill="none" stroke="url(#goldStroke)" stroke-width="0.8"/>

  <!-- Concentric Art Deco Arches / Fans -->
  <!-- Center (45, 45) -->
  <circle cx="45" cy="45" r="24" fill="none" stroke="url(#goldStroke)" stroke-width="1.1"/>
  <circle cx="45" cy="45" r="16" fill="none" stroke="url(#goldStroke)" stroke-width="0.9"/>
  <circle cx="45" cy="45" r="8" fill="none" stroke="url(#goldStroke)" stroke-width="0.7"/>

  <!-- Corners: (0,0), (90,0), (0,90), (90,90) -->
  <circle cx="0" cy="0" r="24" fill="none" stroke="url(#goldStroke)" stroke-width="1.1"/>
  <circle cx="0" cy="0" r="16" fill="none" stroke="url(#goldStroke)" stroke-width="0.9"/>
  <circle cx="0" cy="0" r="8" fill="none" stroke="url(#goldStroke)" stroke-width="0.7"/>

  <circle cx="90" cy="0" r="24" fill="none" stroke="url(#goldStroke)" stroke-width="1.1"/>
  <circle cx="90" cy="0" r="16" fill="none" stroke="url(#goldStroke)" stroke-width="0.9"/>
  <circle cx="90" cy="0" r="8" fill="none" stroke="url(#goldStroke)" stroke-width="0.7"/>

  <circle cx="0" cy="90" r="24" fill="none" stroke="url(#goldStroke)" stroke-width="1.1"/>
  <circle cx="0" cy="90" r="16" fill="none" stroke="url(#goldStroke)" stroke-width="0.9"/>
  <circle cx="0" cy="90" r="8" fill="none" stroke="url(#goldStroke)" stroke-width="0.7"/>

  <circle cx="90" cy="90" r="24" fill="none" stroke="url(#goldStroke)" stroke-width="1.1"/>
  <circle cx="90" cy="90" r="16" fill="none" stroke="url(#goldStroke)" stroke-width="0.9"/>
  <circle cx="90" cy="90" r="8" fill="none" stroke="url(#goldStroke)" stroke-width="0.7"/>

  <!-- Stepped Chevron Accents -->
  <path d="M45 12 L51 18 L45 24 L39 18 Z" fill="#D4AF37" fill-opacity="0.4" stroke="url(#goldStroke)" stroke-width="0.6"/>
  <path d="M45 66 L51 72 L45 78 L39 72 Z" fill="#D4AF37" fill-opacity="0.4" stroke="url(#goldStroke)" stroke-width="0.6"/>
  <path d="M12 45 L18 51 L24 45 L18 39 Z" fill="#D4AF37" fill-opacity="0.4" stroke="url(#goldStroke)" stroke-width="0.6"/>
  <path d="M66 45 L72 51 L78 45 L72 39 Z" fill="#D4AF37" fill-opacity="0.4" stroke="url(#goldStroke)" stroke-width="0.6"/>

  <!-- Center Diamond Pip -->
  <polygon points="45,41 49,45 45,49 41,45" fill="#D4AF37" fill-opacity="0.75" stroke="#9A7416" stroke-width="0.5"/>
</svg>
